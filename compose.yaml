services:
  bot:
    build: .
    init: true
    restart: unless-stopped
    environment:
      SQLITE_PATH: /app/data/vacancies.sqlite3
      SEARCH_CONFIG: /app/data/search.json
      BACKUP_DIR: /app/data/backups
    volumes:
      - ./data:/app/data
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 120s
