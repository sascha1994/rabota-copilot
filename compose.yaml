services:
  bot:
    build: .
    init: true
    restart: unless-stopped
    environment:
      SQLITE_PATH: /app/data/vacancies.sqlite3
      SEARCH_CONFIG: /app/data/search.json
      BACKUP_DIR: /app/data/backups
      BROWSER_PROFILE_DIR: /app/data/browser-profile
      BROWSER_CHANNEL: chromium
    volumes:
      - type: bind
        source: ${RABOTA_STATE_DIR:-/srv/rabota-copilot}/data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ${RABOTA_STATE_DIR:-/srv/rabota-copilot}/.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/copilot:size=128m,uid=10001,gid=10001,mode=0700
    shm_size: 512m
    ports:
      - "127.0.0.1:5900:5900"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/chromium-seccomp.json
    stop_grace_period: 120s
