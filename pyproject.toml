[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rabota-copilot"
version = "0.1.0"
description = "Vacancy search, candidate profiles and on-demand AI assessment for rabota.by"
requires-python = ">=3.11"
dependencies = ["aiogram==3.31.0", "pydantic==2.13.5", "httpx[socks]==0.28.1"]

[project.optional-dependencies]
browser = ["playwright==1.65.2"]

[project.scripts]
rabota-copilot = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
